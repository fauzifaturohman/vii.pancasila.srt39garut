<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SRT 39 Garut - Pancasila Kelas VII</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 1100px;
            min-height: 100vh;
            background: #fff;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.08);
            border-radius: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        @media (min-width:768px) {
            .app-container {
                border-radius: 28px;
                min-height: 96vh;
                margin: 16px;
            }
        }

        /* HEADER */
        .app-header {
            background: linear-gradient(135deg, #1a3a5c 0%, #2b5f8a 100%);
            padding: 18px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 4px solid #f9c74f;
            flex-shrink: 0;
        }
        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .app-header .brand img {
            height: 48px;
            width: 48px;
            object-fit: contain;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px;
        }
        .app-header .brand h1 {
            color: #fff;
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: 0.3px;
        }
        .app-header .brand h1 small {
            display: block;
            font-size: 0.65rem;
            font-weight: 400;
            opacity: 0.8;
        }
        .app-header .user-info {
            color: #fff;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .app-header .user-info .greeting {
            background: rgba(255, 255, 255, 0.12);
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 500;
        }
        .btn-logout {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 6px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .btn-logout:hover {
            background: #e74c3c;
            border-color: #e74c3c;
        }

        /* MAIN */
        .app-main {
            flex: 1;
            padding: 24px 28px 32px;
            overflow-y: auto;
            background: #fafbfc;
        }

        /* LOGIN */
        .login-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            text-align: center;
            padding: 20px;
        }
        .login-page .logo-big {
            width: 100px;
            height: 100px;
            margin-bottom: 16px;
            background: #1a3a5c;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 3rem;
            font-weight: 800;
        }
        .login-page h2 {
            font-size: 1.8rem;
            color: #1a3a5c;
            margin-bottom: 8px;
        }
        .login-page p {
            color: #555;
            margin-bottom: 28px;
            max-width: 400px;
        }
        .login-form {
            width: 100%;
            max-width: 380px;
            background: #fff;
            padding: 32px 28px;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            border: 1px solid #e9edf2;
        }
        .login-form label {
            display: block;
            text-align: left;
            font-weight: 600;
            font-size: 0.85rem;
            color: #333;
            margin: 12px 0 4px;
        }
        .login-form input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e6ed;
            border-radius: 14px;
            font-size: 1rem;
            transition: 0.2s;
            background: #f8f9fb;
        }
        .login-form input:focus {
            outline: none;
            border-color: #2b5f8a;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(43, 95, 138, 0.1);
        }
        .login-form .btn-login {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: linear-gradient(135deg, #1a3a5c, #2b5f8a);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
        }
        .login-form .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(26, 58, 92, 0.3);
        }
        .login-error {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 12px;
        }

        /* DASHBOARD */
        .dashboard {
            display: none;
        }
        .dashboard.active {
            display: block;
        }

        .welcome-banner {
            background: linear-gradient(135deg, #eef4fa, #dce6f0);
            padding: 20px 24px;
            border-radius: 20px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .welcome-banner h2 {
            color: #1a3a5c;
            font-size: 1.3rem;
        }
        .welcome-banner h2 span {
            color: #c0392b;
        }
        .welcome-banner .badge-score {
            background: #1a3a5c;
            color: #fff;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        /* BAB CARDS */
        .bab-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            margin: 20px 0 32px;
        }
        @media (min-width: 700px) {
            .bab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (min-width: 1000px) {
            .bab-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .bab-card {
            background: #fff;
            border-radius: 20px;
            padding: 20px 22px 22px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            border: 1px solid #eef1f6;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
        }
        .bab-card:hover {
            border-color: #c5d5e6;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }
        .bab-card .bab-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .bab-card .bab-number {
            background: #1a3a5c;
            color: #fff;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 2px 14px;
            border-radius: 30px;
        }
        .bab-card .bab-status {
            font-size: 0.75rem;
            font-weight: 600;
            color: #27ae60;
        }
        .bab-card .bab-status.done {
            color: #27ae60;
        }
        .bab-card .bab-status.not-done {
            color: #95a5a6;
        }
        .bab-card h3 {
            font-size: 1.1rem;
            color: #1a3a5c;
            margin: 4px 0 6px;
        }
        .bab-card .bab-summary {
            font-size: 0.88rem;
            color: #444;
            line-height: 1.6;
            flex: 1;
            margin: 6px 0 14px;
            max-height: 80px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
        }
        .bab-card .bab-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: auto;
        }
        .bab-card .bab-actions button {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
            min-width: 80px;
        }
        .btn-materi {
            background: #eef4fa;
            color: #1a3a5c;
        }
        .btn-materi:hover {
            background: #dce6f0;
        }
        .btn-kuis {
            background: #1a3a5c;
            color: #fff;
        }
        .btn-kuis:hover {
            background: #2b5f8a;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26, 58, 92, 0.25);
        }
        .btn-kuis:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .btn-kuis.done {
            background: #27ae60;
        }

        /* RANKING BUTTON */
        .ranking-section {
            text-align: center;
            margin: 10px 0 10px;
        }
        .btn-ranking {
            background: linear-gradient(135deg, #f9c74f, #f5a623);
            color: #1a3a5c;
            border: none;
            padding: 14px 44px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 4px 14px rgba(245, 166, 35, 0.3);
        }
        .btn-ranking:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(245, 166, 35, 0.4);
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #fff;
            max-width: 780px;
            width: 100%;
            max-height: 90vh;
            border-radius: 28px;
            padding: 28px 30px 34px;
            overflow-y: auto;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            position: relative;
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-box .close-modal {
            position: sticky;
            top: 0;
            float: right;
            background: #f1f3f6;
            border: none;
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 300;
            color: #333;
            transition: 0.15s;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-box .close-modal:hover {
            background: #e74c3c;
            color: #fff;
        }
        .modal-box h2 {
            color: #1a3a5c;
            font-size: 1.5rem;
            margin: 6px 0 16px;
            padding-right: 40px;
        }
        .modal-box .modal-body {
            margin-top: 8px;
        }

        /* MATERI */
        .materi-content {
            font-size: 0.95rem;
            line-height: 1.8;
            color: #222;
        }
        .materi-content h4 {
            color: #1a3a5c;
            margin: 18px 0 6px;
            font-size: 1.1rem;
        }
        .materi-content ul {
            padding-left: 22px;
            margin: 6px 0 12px;
        }
        .materi-content ul li {
            margin: 4px 0;
        }
        .materi-content .highlight {
            background: #fef9e7;
            padding: 12px 16px;
            border-radius: 12px;
            border-left: 4px solid #f9c74f;
            margin: 12px 0;
        }

        /* KUIS */
        .quiz-question {
            background: #f8f9fb;
            padding: 18px 20px;
            border-radius: 16px;
            margin-bottom: 14px;
            border: 1px solid #edf0f5;
        }
        .quiz-question .q-text {
            font-weight: 600;
            font-size: 0.98rem;
            color: #1a3a5c;
            margin-bottom: 8px;
        }
        .quiz-question .q-options {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-left: 4px;
        }
        .quiz-question .q-options label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.92rem;
            padding: 5px 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.1s;
        }
        .quiz-question .q-options label:hover {
            background: #eef4fa;
        }
        .quiz-question .q-options input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #1a3a5c;
            flex-shrink: 0;
        }
        .quiz-progress {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0 18px;
            font-weight: 600;
            color: #1a3a5c;
        }
        .btn-submit-quiz {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #27ae60, #1e8449);
            color: #fff;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn-submit-quiz:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.35);
        }
        .btn-submit-quiz:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* HASIL KUIS */
        .quiz-result {
            text-align: center;
            padding: 12px 0;
        }
        .quiz-result .score-big {
            font-size: 4rem;
            font-weight: 800;
            color: #1a3a5c;
        }
        .quiz-result .score-big span {
            font-size: 1.8rem;
            color: #666;
        }
        .quiz-result .score-label {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 6px;
        }
        .quiz-result .result-detail {
            margin: 16px 0 10px;
            text-align: left;
            max-height: 300px;
            overflow-y: auto;
            background: #f8f9fb;
            border-radius: 16px;
            padding: 12px 16px;
        }
        .quiz-result .result-detail .r-item {
            padding: 6px 0;
            border-bottom: 1px solid #eef1f6;
            font-size: 0.88rem;
        }
        .quiz-result .result-detail .r-item .r-correct {
            color: #27ae60;
            font-weight: 600;
        }
        .quiz-result .result-detail .r-item .r-wrong {
            color: #e74c3c;
            font-weight: 600;
        }

        /* RANKING */
        .ranking-table-wrap {
            overflow-x: auto;
        }
        .ranking-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .ranking-table th {
            background: #1a3a5c;
            color: #fff;
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
        }
        .ranking-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #eef1f6;
        }
        .ranking-table tr:nth-child(even) {
            background: #f8f9fb;
        }
        .ranking-table .rank-1 {
            background: #fef9e7 !important;
        }
        .ranking-table .rank-2 {
            background: #f5f6fa !important;
        }
        .ranking-table .rank-3 {
            background: #fdf2e9 !important;
        }
        .rank-medal {
            font-weight: 700;
        }
        .rank-medal.gold {
            color: #f9c74f;
        }
        .rank-medal.silver {
            color: #bdc3c7;
        }
        .rank-medal.bronze {
            color: #e67e22;
        }

        /* SCROLLBAR */
        .modal-box::-webkit-scrollbar {
            width: 6px;
        }
        .modal-box::-webkit-scrollbar-track {
            background: #eef1f6;
            border-radius: 10px;
        }
        .modal-box::-webkit-scrollbar-thumb {
            background: #c5d5e6;
            border-radius: 10px;
        }

        /* UTILITY */
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .gap-8 {
            gap: 8px;
        }

        /* RESPONSIVE */
        @media (max-width: 500px) {
            .app-header {
                padding: 14px 16px;
            }
            .app-header .brand h1 {
                font-size: 0.95rem;
            }
            .app-header .brand img {
                height: 38px;
                width: 38px;
            }
            .app-main {
                padding: 16px;
            }
            .modal-box {
                padding: 20px 16px 24px;
            }
            .bab-card {
                padding: 16px;
            }
            .welcome-banner {
                padding: 16px;
                flex-direction: column;
                text-align: center;
            }
            .login-form {
                padding: 24px 18px;
            }
            .quiz-question {
                padding: 14px 14px;
            }
        }
    </style>
</head>

        // ============================================================
        // STATE
        // ============================================================
        let currentUser = null; // nama siswa
        let quizState = { bab: null, answers: [], questions: [] };
        let allScores = {}; // { "nama": { bab1: 80, bab2: 70, ... } }
        let rankingCache = [];

        // ============================================================
        // DOM REFS
        // ============================================================
        const $ = (id) => document.getElementById(id);

        // ============================================================

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function loadScores() {
            try {
                const raw = localStorage.getItem('srt39_scores');
                if (raw) allScores = JSON.parse(raw);
            } catch (_) { allScores = {}; }
        }

        function saveScores() {
            localStorage.setItem('srt39_scores', JSON.stringify(allScores));
        }

        function getStudentScore(student, bab) {
            if (!allScores[student]) return null;
            return allScores[student][bab] !== undefined ? allScores[student][bab] : null;
        }

        function setStudentScore(student, bab, score) {
            if (!allScores[student]) allScores[student] = {};
            allScores[student][bab] = score;
            saveScores();
        }

        function getBabLabel(bab) {
            const map = { bab1: 'Bab 1', bab2: 'Bab 2', bab3: 'Bab 3', bab4: 'Bab 4', bab5: 'Bab 5' };

        function getBabMateri(bab) {

        // ============================================================
        // RENDER DASHBOARD
        // ============================================================
        function renderDashboard() {
            if (!currentUser) return;
            dashName.textContent = currentUser;
            const avg = getAverageScore(currentUser);
            dashAvgScore.textContent = `⭐ Rata-rata: ${avg}`;

            const babKeys = ['bab1', 'bab2', 'bab3', 'bab4', 'bab5'];
            babGrid.innerHTML = '';
            babKeys.forEach((bab) => {
                const score = getStudentScore(currentUser, bab);
                const done = score !== null && score !== undefined;
                const card = document.createElement('div');
                card.className = 'bab-card';
                card.innerHTML = `
                    <div class="bab-header">
                        <span class="bab-number">${getBabLabel(bab)}</span>
                        <span class="bab-status ${done ? 'done' : 'not-done'}">${done ? '✅ Selesai' : '⏳ Belum'}</span>
                    </div>
                    <h3>${getBabTitle(bab)}</h3>
                    <div class="bab-summary">${getBabSummary(bab)}</div>
                    ${done ? `<div style="font-weight:700;color:#1a3a5c;margin-bottom:8px;">Nilai: ${score}</div>` : ''}
                    <div class="bab-actions">
                        <button class="btn-materi" data-bab="${bab}">📖 Materi</button>
                        <button class="btn-kuis ${done ? 'done' : ''}" data-bab="${bab}" ${done ? 'disabled' : ''}>
                            ${done ? '✅ Kerjakan Ulang' : '📝 Kuis'}
                        </button>
                    </div>
                `;
                babGrid.appendChild(card);
            });

            // Event listeners for materi & kuis
            document.querySelectorAll('.btn-materi').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const bab = btn.dataset.bab;
                    showMateri(bab);
                });
            });
            document.querySelectorAll('.btn-kuis').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const bab = btn.dataset.bab;
                    startQuiz(bab);
                });
            });
        }

        function getAverageScore(student) {
            const babKeys = ['bab1', 'bab2', 'bab3', 'bab4', 'bab5'];
            let total = 0,
                count = 0;
            babKeys.forEach((b) => {
                const s = getStudentScore(student, b);
                if (s !== null && s !== undefined) { total += s;
                    count++; }
            });
            return count === 0 ? 0 : Math.round(total / count);
        }

        // ============================================================
        // MATERI
        // ============================================================
        function showMateri(bab) {
            modalTitle.textContent = `${getBabLabel(bab)} – ${getBabTitle(bab)}`;
            modalBody.innerHTML = getBabMateri(bab);
            modalOverlay.classList.add('active');
        }

        // ============================================================
        // KUIS
        // ============================================================
        function startQuiz(bab) {
            const pool = QUESTION_BANK[bab];
            if (!pool) return;
            // shuffle and pick 25 (or all if less)
            const shuffled = shuffleArray([...pool]);
            const selected = shuffled.slice(0, 25);

            // Build quiz HTML
            let html = `
                <div class="quiz-progress">
                    <span>📝 <strong>${getBabLabel(bab)}</strong> – ${getBabTitle(bab)}</span>
                    <span id="quizCounter">1 / ${selected.length}</span>
                </div>
                <div id="quizContainer">
            `;
            selected.forEach((q, idx) => {
                html += `
                    <div class="quiz-question" data-idx="${idx}">
                        <div class="q-text">${idx+1}. ${q.q}</div>
                        <div class="q-options">
                            ${q.o.map((opt, oi) => `
                                <label>
                                    <input type="radio" name="q${idx}" value="${oi}" />
                                    ${opt}
                                </label>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            html += `
                </div>
                <button class="btn-submit-quiz" id="btnSubmitQuiz">✅ Kirim Jawaban</button>
            `;
            modalTitle.textContent = `📝 Kuis ${getBabLabel(bab)}`;
            modalBody.innerHTML = html;
            modalOverlay.classList.add('active');

            // Store quiz state
            quizState.bab = bab;
            quizState.questions = selected;
            quizState.answers = new Array(selected.length).fill(null);

            // Update counter on change
            document.querySelectorAll('.quiz-question input[type="radio"]').forEach((radio) => {
                radio.addEventListener('change', () => {
                    const idx = parseInt(radio.closest('.quiz-question').dataset.idx);
                    quizState.answers[idx] = parseInt(radio.value);
                    updateQuizCounter();
                });
            });

            // Submit
            document.getElementById('btnSubmitQuiz').addEventListener('click', submitQuiz);

            function updateQuizCounter() {
                const answered = quizState.answers.filter(a => a !== null).length;
                const total = quizState.questions.length;
                document.getElementById('quizCounter').textContent = `${answered} / ${total}`;
            }
        }

        function submitQuiz() {
            const questions = quizState.questions;
            const answers = quizState.answers;
            const total = questions.length;
            let correct = 0;
            const details = [];
            for (let i = 0; i < total; i++) {
                const userAns = answers[i];
                const correctAns = questions[i].a;
                const isCorrect = userAns === correctAns;
                if (isCorrect) correct++;
                details.push({
                    q: questions[i].q,
                    user: userAns !== null ? questions[i].o[userAns] : '(tidak dijawab)',
                    correct: questions[i].o[correctAns],
                    isCorrect: userAns === correctAns
                });
            }
            const score = Math.round((correct / total) * 100);
            // Save score
            setStudentScore(currentUser, quizState.bab, score);

            // Show result
            let resultHtml = `
                <div class="quiz-result">
                    <div class="score-label">Nilai Kuis</div>
                    <div class="score-big">${score}<span> / 100</span></div>
                    <div style="margin:6px 0 12px;font-weight:600;color:#1a3a5c;">${correct} dari ${total} jawaban benar</div>
                    <div class="result-detail">
                        ${details.map((d, i) => `
                            <div class="r-item">
                                <strong>${i+1}.</strong> ${d.q}<br />
                                <span style="color:#555;">Jawaban Anda: ${d.user}</span><br />
                                <span class="${d.isCorrect ? 'r-correct' : 'r-wrong'}">${d.isCorrect ? '✅ Benar' : '❌ Salah'} (Jawaban benar: ${d.correct})</span>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn-submit-quiz" style="background:linear-gradient(135deg,#1a3a5c,#2b5f8a);" id="btnCloseResult">Tutup</button>
                </div>
            `;
            modalBody.innerHTML = resultHtml;
            document.getElementById('btnCloseResult').addEventListener('click', () => {
                modalOverlay.classList.remove('active');
                renderDashboard();
            });
            // Update ranking cache
            buildRanking();
        }

        // ============================================================
        // RANKING
        // ============================================================
        function buildRanking() {
            const babKeys = ['bab1', 'bab2', 'bab3', 'bab4', 'bab5'];
            const ranking = STUDENTS.map((name) => {
                const scores = {};
                let total = 0,
                    count = 0;
                babKeys.forEach((b) => {
                    const s = getStudentScore(name, b);
                    if (s !== null && s !== undefined) {
                        scores[b] = s;
                        total += s;
                        count++;
                    }
                });
                const avg = count === 0 ? 0 : Math.round(total / count);
                return { name, scores, avg, count };
            });
            ranking.sort((a, b) => b.avg - a.avg);
            rankingCache = ranking;
            return ranking;
        }

        function showRanking() {
            const ranking = buildRanking();
            let html = `
                <div style="margin-bottom:12px;font-weight:500;color:#555;">🏆 Peringkat berdasarkan rata-rata nilai kuis (0–100)</div>
                <div class="ranking-table-wrap">
                    <table class="ranking-table">
                        <thead>
                            <tr><th>#</th><th>Nama</th><th>Bab 1</th><th>Bab 2</th><th>Bab 3</th><th>Bab 4</th><th>Bab 5</th><th>Rata-rata</th></tr>
                        </thead>
                        <tbody>
            `;
            ranking.forEach((item, idx) => {
                const rankClass = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : '';
                const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx+1}`;
                const babKeys = ['bab1', 'bab2', 'bab3', 'bab4', 'bab5'];
                html += `
                    <tr class="${rankClass}">
                        <td><span class="rank-medal ${idx===0?'gold':idx===1?'silver':idx===2?'bronze':''}">${medal}</span></td>
                        <td><strong>${item.name}</strong></td>
                        ${babKeys.map(b => `<td>${item.scores[b] !== undefined ? item.scores[b] : '-'}</td>`).join('')}
                        <td><strong>${item.avg}</strong></td>
                    </tr>
                `;
            });
            html += `
                        </tbody>
                    </table>
                </div>
                <div style="margin-top:14px;font-size:0.85rem;color:#888;">* Nilai berdasarkan kuis yang telah dikerjakan. Kosong (-) = belum mengerjakan.</div>
            `;
            modalTitle.textContent = '🏆 Peringkat Kelas';
            modalBody.innerHTML = html;
            modalOverlay.classList.add('active');
        }

        // ============================================================
        // LOGIN / LOGOUT
        // ============================================================
        function doLogin(username, password) {
            if (password !== 'pancasila') {
                loginError.textContent = '❌ Kata sandi salah. Gunakan "pancasila".';
                return false;
            }
            const normalized = username.trim();
            // Cek apakah ada di daftar siswa (case insensitive)
            const found = STUDENTS.find(s => s.toLowerCase() === normalized.toLowerCase());
            if (!found) {
                loginError.textContent = '❌ Nama tidak terdaftar. Periksa kembali nama lengkap Anda.';
                return false;
            }
            currentUser = found;
            loginError.textContent = '';
            loginPage.style.display = 'none';
            dashboard.classList.add('active');
            greetingText.textContent = `Halo, ${found}`;
            renderDashboard();
            return true;
        }

        function doLogout() {
            currentUser = null;
            loginPage.style.display = 'flex';
            dashboard.classList.remove('active');
            usernameInput.value = '';
            passwordInput.value = '';
            loginError.textContent = '';
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const uname = usernameInput.value.trim();
            const pwd = passwordInput.value.trim();
            doLogin(uname, pwd);
        });

        btnLogout.addEventListener('click', doLogout);

        closeModal.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) modalOverlay.classList.remove('active');
        });

        btnShowRanking.addEventListener('click', showRanking);

        // Enter key on login
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loginForm.dispatchEvent(new Event('submit'));
        });
        usernameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loginForm.dispatchEvent(new Event('submit'));
        });

        // ============================================================
        // INIT
        // ============================================================
        loadScores();
        // Check if user already logged in (via sessionStorage)
        try {
            const saved = sessionStorage.getItem('srt39_user');
            if (saved && STUDENTS.includes(saved)) {
                currentUser = saved;
                loginPage.style.display = 'none';
                dashboard.classList.add('active');
                greetingText.textContent = `Halo, ${saved}`;
                renderDashboard();
            }
        } catch (_) {}

        // Save user on login
        const origLogin = doLogin;
        doLogin = function(username, password) {
            const result = origLogin.call(this, username, password);
            if (result && currentUser) {
                try { sessionStorage.setItem('srt39_user', currentUser); } catch (_) {}
            }
            return result;
        };

        // Override logout to clear session
        const origLogout = doLogout;
        doLogout = function() {
            try { sessionStorage.removeItem('srt39_user'); } catch (_) {}
            origLogout.call(this);
        };

        // Re-bind login form
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const uname = usernameInput.value.trim();
            const pwd = passwordInput.value.trim();
            doLogin(uname, pwd);
        });

        // Re-bind logout
        btnLogout.addEventListener('click', doLogout);

        // If already logged in, ensure the login form doesn't show
        if (currentUser) {
            loginPage.style.display = 'none';
            dashboard.classList.add('active');
            greetingText.textContent = `Halo, ${currentUser}`;
            renderDashboard();
        }

        console.log('✅ SRT 39 Garut – Pancasila Kelas VII siap!');
        console.log(`📚 ${STUDENTS.length} siswa terdaftar.`);
        console.log('🔑 Login: nama lengkap, password: pancasila');
    </script>
</body>
